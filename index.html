<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mushroom Body Project</title>

  <!-- External CSS (use this as your main styling file) -->
  <link rel="stylesheet" href="style.css">

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <h1>Fly Mushroom Body Atlas</h1>

  <p>
    Open-access resource for spatial transcriptomics and multi-omic analysis.
  </p>

  <img src="fly_cartoon.png" alt="Fly cartoon" width="250">

  <!-- ===== STUDIES SECTION ===== -->
  <h2>Bulk and Single-cell RNA-seq Fly Brain Resources</h2>

  <div id="md-content">Loading studies...</div>

  <script>
    fetch("bulk_singlecell_studies.md")
      .then(response => response.text())
      .then(md => {
        document.getElementById("md-content").innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById("md-content").innerHTML =
          "Error loading markdown file.";
      });
  </script>

  <!-- ===== 3D TOGGLE SECTION ===== -->
  <h2>3D Toggle Example</h2>

  <label class="switch">

    <input type="checkbox">

    <span class="slider"></span>

    <div class="card">
      Mushroom Body Atlas View
    </div>

  </label>

</body>
</html>
