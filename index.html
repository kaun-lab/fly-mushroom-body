<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mushroom Body Project</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      line-height: 1.6;
      background-color: #f7f9fc;
      color: #222;
    }

    h1 {
      color: #2b4c7e;
    }

    img {
      margin: 20px 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
    }

    th {
      background-color: #eef2f7;
      text-align: left;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    a {
      color: #1a0dab;
    }
  </style>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <h1>Fly Mushroom Body Atlas</h1>

  <p>Open-access resource for spatial transcriptomics and multi-omic analysis.</p>

  <figure>
  <img 
    src="kaun_futureofmB.png" 
    alt="Future avenues in Drosophila mushroom body research"
    style="width:100%; max-width:900px; display:block; margin:auto;"
  >

  <figcaption style="font-size:14px; color:#555; text-align:center; margin-top:8px;">
    Adapted from Chan et al., 2024, <i>Learning &amp; Memory</i>, 
    “Future avenues in Drosophila mushroom body research,” Cold Spring Harbor Laboratory Press.
  </figcaption>
</figure>
  
  <img src="fly_cartoon.png" alt="Fly cartoon" width="250">

  <h2>Prezi embedding: Drosophila Concept Map</h2>

    <div style="width:100%; height:75vh;">
  <iframe 
    src="https://prezi.com/p/embed/Xmor3zN090VlLNIlVFEJ/"
    style="width:100%; height:100%; border:0;"
    allowfullscreen
    allow="autoplay; fullscreen">
  </iframe>
  </div>
<h2>Drosophila Brain 3D Model</h2>

<div class="sketchfab-embed-wrapper">
  <iframe 
    title="3D MODEL DROSOPHILA BRAIN"
    frameborder="0"
    allowfullscreen
    mozallowfullscreen="true"
    webkitallowfullscreen="true"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    xr-spatial-tracking
    execution-while-out-of-viewport
    execution-while-not-rendered
    web-share
    src="https://sketchfab.com/models/8706cbed8d0f4c64bfabef61bf682054/embed"
    style="width:100%; height:600px;">
  </iframe>
</div>
  
  <h2>3D UMAP Viewer</h2>

<iframe 
  src="mergedNEW_sobj_3D_UMAP_dataset.html"
  width="100%"
  height="700px"
  style="border:none; margin-top:10px;">
  </iframe>
  
  <img 
  src="dotplot_merged_mb.png"
  alt="Dotplot"
  style="width:100%; max-width:1200px; display:block; margin:auto;">
  
  <h2>3D points in space tester </h2>

<button onclick="toggleSpin()">Toggle Rotation</button>

<canvas id="umapCanvas" style="width:100%; height:500px; display:block; margin-top:10px;"></canvas>
  
  <h2>Bulk and single-cell RNA-seq fly brain marker resources</h2>

  <!-- This is where your .md file will appear -->
  <div id="md-content">Loading studies...</div>

  <script>
    fetch("bulk_singlecell_studies.md")
      .then(response => response.text())
      .then(md => {
        document.getElementById("md-content").innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById("md-content").innerHTML =
          "Error loading markdown file.";
      });
  </script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("umapCanvas"), alpha: true });

renderer.setSize(window.innerWidth * 0.9, 500);

// fake UMAP points
for (let i = 0; i < 300; i++) {
  let x = (Math.random() - 0.5) * 6;
  let y = (Math.random() - 0.5) * 6;
  let z = (Math.random() - 0.5) * 6;

  let geometry = new THREE.SphereGeometry(0.05, 8, 8);
  let material = new THREE.MeshBasicMaterial({ color: 0x2b4c7e });
  let dot = new THREE.Mesh(geometry, material);

  dot.position.set(x, y, z);
  scene.add(dot);
}

camera.position.z = 8;

let spinning = true;

function toggleSpin() {
  spinning = !spinning;
}

function animate() {
  requestAnimationFrame(animate);

  if (spinning) {
    scene.rotation.y += 0.003;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
